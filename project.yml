name: BrianKeysTest
options:
  bundleIdPrefix: com.brianklauer
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
targets:
  BrianKeysTest:
    type: application
    platform: iOS
    sources:
      - App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: BrianKeysTest
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brianklauer.briankeys
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: BrianKeysTest
    dependencies:
      - target: BrianKeysKeyboard
        embed: true
  BrianKeysKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: BrianKeys
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brianklauer.briankeys.keyboard
        PRODUCT_NAME: BrianKeysKeyboard
