name: Build unsigned IPA

on:
  push:
  workflow_dispatch:

# The release step below needs write access to Contents.
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install XcodeGen (turns project.yml into an Xcode project)
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build the app (no signing — SideStore signs it on the iPhone)
        run: |
          xcodebuild \
            -project BrianKeysTest.xcodeproj \
            -scheme BrianKeysTest \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath build/DD \
            build

      - name: Package the .ipa
        run: |
          mkdir -p Payload
          cp -R "build/DD/Build/Products/Release-iphoneos/BrianKeysTest.app" Payload/
          zip -r BrianKeysTest-unsigned.ipa Payload

      - name: Save the .ipa as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrianKeysTest-unsigned-ipa
          path: BrianKeysTest-unsigned.ipa

      # Also publish the .ipa as a Release asset: release files of a
      # public repo can be downloaded without a token, which is how
      # Muse fetches the build now that GitHub is connected via OAuth
      # (the connector has no Actions-artifact access).
      - name: Publish the .ipa as a release asset
        run: gh release create "build-${{ github.run_number }}" BrianKeysTest-unsigned.ipa --title "Build ${{ github.run_number }}" --notes "Automated unsigned build — install via SideStore."
        env:
          GH_TOKEN: ${{ github.token }}
